<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Posta Simulator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    color:white;
    padding:20px;
}

header{
    background:#ffcc00;
    color:black;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

h1{
    font-size:35px;
}

.panel{
    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th, td{
    padding:14px;
    border-bottom:1px solid #333;
    text-align:left;
}

th{
    color:#ffcc00;
}

button{
    background:#ffcc00;
    color:black;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.8;
}

input{
    padding:12px;
    border:none;
    border-radius:10px;
    margin:5px;
    width:220px;
}

.status{
    padding:6px 10px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
}

.ready{ background:green; }
.road{ background:orange; }
.done{ background:dodgerblue; }

.money{
    margin-top:20px;
    font-size:24px;
    color:#00ff88;
}

.search{
    margin-top:15px;
}

#searchResult{
    margin-top:15px;
    font-size:18px;
}

.empty{
    text-align:center;
    color:#777;
}

</style>
</head>

<body>

<header>
    <h1>📦 Nova Posta Simulator</h1>
    <p>Симулятор видачі посилок</p>
</header>

<div class="panel">

    <h2>🔎 Пошук ТТН</h2>

    <div class="search">
        <input type="text" id="searchInput" placeholder="Введіть ТТН">
        <button onclick="searchTTN()">Пошук</button>
    </div>

    <p id="searchResult"></p>

</div>

<div class="panel">

    <h2>📋 Посилки</h2>

    <table id="parcelTable">

        <thead>
            <tr>
                <th>ТТН</th>
                <th>Клієнт</th>
                <th>Статус</th>
                <th>Оплата</th>
                <th>Дія</th>
            </tr>
        </thead>

        <tbody id="parcelBody">

            <tr class="empty-row">
                <td colspan="5" class="empty">
                    Немає посилок
                </td>
            </tr>

        </tbody>

    </table>

    <div class="money">
        💰 Зароблено:
        <span id="money">0</span> ₴
    </div>

</div>

<div class="panel">

    <h2>➕ Додати клієнта</h2>

    <input type="text" id="newTTN" placeholder="ТТН">
    <input type="text" id="newName" placeholder="Ім'я клієнта">
    <input type="number" id="newPrice" placeholder="Оплата">

    <button onclick="addParcel()">
        Додати
    </button>

</div>

<script>

let earned = 0;

function giveParcel(button){

    let row = button.parentElement.parentElement;

    row.cells[2].innerHTML =
        '<span class="status done">Видано</span>';

    let price = parseInt(row.cells[3].innerText);

    earned += price;

    document.getElementById("money").innerText = earned;

    button.disabled = true;
    button.innerText = "Видано";
}

function moveParcel(button){

    let row = button.parentElement.parentElement;

    row.cells[2].innerHTML =
        '<span class="status ready">Готово до видачі</span>';

    button.innerText = "Готово";
}

function searchTTN(){

    let input = document.getElementById("searchInput").value;
    let rows = document.querySelectorAll("#parcelTable tbody tr");

    let found = false;

    rows.forEach(row => {

        let ttn = row.cells[0].innerText;

        if(ttn === input){

            document.getElementById("searchResult").innerHTML =
                "✅ Знайдено клієнта: " + row.cells[1].innerText;

            found = true;
        }
    });

    if(!found){
        document.getElementById("searchResult").innerHTML =
            "❌ ТТН не знайдено";
    }
}

function addParcel(){

    let ttn = document.getElementById("newTTN").value;
    let name = document.getElementById("newName").value;
    let price = document.getElementById("newPrice").value;

    if(ttn === "" || name === "" || price === ""){
        alert("Заповни всі поля");
        return;
    }

    let table = document.getElementById("parcelBody");

    // прибрати "Немає посилок"
    let emptyRow = document.querySelector(".empty-row");
    if(emptyRow) emptyRow.remove();

    let row = document.createElement("tr");

    row.innerHTML = `
        <td>${ttn}</td>
        <td>${name}</td>
        <td><span class="status ready">Готово до видачі</span></td>
        <td>${price} ₴</td>
        <td><button onclick="giveParcel(this)">Видати</button></td>
    `;

    table.appendChild(row);

    document.getElementById("newTTN").value = "";
    document.getElementById("newName").value = "";
    document.getElementById("newPrice").value = "";
}

</script>

</body>
</html>
