<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Delivery Simulator</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#111;
        color:white;
        padding:20px;
    }

    header{
        background:#ffcc00;
        color:black;
        padding:20px;
        border-radius:12px;
        margin-bottom:20px;
    }

    h1{
        font-size:32px;
    }

    .panel{
        background:#1d1d1d;
        padding:20px;
        border-radius:12px;
        margin-bottom:20px;
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-top:15px;
    }

    th, td{
        border-bottom:1px solid #333;
        padding:12px;
        text-align:left;
    }

    th{
        color:#ffcc00;
    }

    button{
        background:#ffcc00;
        border:none;
        padding:10px 16px;
        border-radius:8px;
        cursor:pointer;
        font-weight:bold;
        margin-right:5px;
    }

    button:hover{
        opacity:0.8;
    }

    .status{
        padding:6px 10px;
        border-radius:8px;
        font-size:14px;
        font-weight:bold;
    }

    .ready{
        background:green;
    }

    .road{
        background:orange;
    }

    .done{
        background:dodgerblue;
    }

    .controls{
        margin-top:20px;
    }

    input{
        padding:10px;
        width:250px;
        border:none;
        border-radius:8px;
        margin-right:10px;
    }

    .money{
        color:#00ff88;
        font-size:22px;
        margin-top:10px;
    }
</style>
</head>

<body>

<header>
    <h1>📦 Nova Delivery Simulator</h1>
    <p>Симулятор оператора пошти</p>
</header>

<div class="panel">
    <h2>Пошук ТТН</h2>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Введіть номер ТТН">
        <button onclick="searchTTN()">Пошук</button>
    </div>

    <p id="searchResult" style="margin-top:15px;"></p>
</div>

<div class="panel">
    <h2>Список посилок</h2>

    <table id="parcelTable">
        <thead>
            <tr>
                <th>ТТН</th>
                <th>Клієнт</th>
                <th>Статус</th>
                <th>Оплата</th>
                <th>Дія</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>20481234</td>
                <td>Іван</td>
                <td><span class="status ready">Готово до видачі</span></td>
                <td>120 ₴</td>
                <td>
                    <button onclick="giveParcel(this)">Видати</button>
                </td>
            </tr>

            <tr>
                <td>99887766</td>
                <td>Олена</td>
                <td><span class="status road">У дорозі</span></td>
                <td>80 ₴</td>
                <td>
                    <button onclick="moveParcel(this)">Оновити</button>
                </td>
            </tr>

        </tbody>
    </table>

    <div class="money">
        💰 Зароблено: <span id="money">0</span> ₴
    </div>
</div>

<script>

let earned = 0;

function giveParcel(button){

    let row = button.parentElement.parentElement;

    row.cells[2].innerHTML =
        '<span class="status done">Видано</span>';

    earned += 120;

    document.getElementById("money").innerText = earned;

    button.disabled = true;
    button.innerText = "Видано";
}

function moveParcel(button){

    let row = button.parentElement.parentElement;

    row.cells[2].innerHTML =
        '<span class="status ready">Готово до видачі</span>';

    button.innerText = "Готово";
}

function searchTTN(){

    let input =
        document.getElementById("searchInput")
        .value;

    let rows =
        document.querySelectorAll("#parcelTable tbody tr");

    let found = false;

    rows.forEach(row => {

        let ttn = row.cells[0].innerText;

        if(ttn === input){

            document.getElementById("searchResult")
                .innerHTML =
                "✅ Посилка знайдена: " +
                row.cells[1].innerText;

            found = true;
        }

    });

    if(!found){

        document.getElementById("searchResult")
            .innerHTML =
            "❌ ТТН не знайдено";
    }
}

</script>

</body>
</html>
