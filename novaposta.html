<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Posta Simulator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    color:white;
    padding:20px;
}

header{
    background:#ffcc00;
    color:black;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

h1{ font-size:35px; }

.panel{
    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th, td{
    padding:14px;
    border-bottom:1px solid #333;
    text-align:left;
}

th{ color:#ffcc00; }

button{
    background:#ffcc00;
    color:black;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{ opacity:0.8; }

input{
    padding:12px;
    border:none;
    border-radius:10px;
    margin:5px;
    width:220px;
}

.status{
    padding:6px 10px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
}

.pack{ background:gray; }
.road{ background:orange; }
.arrived{ background:deepskyblue; }
.returning{ background:purple; }
.back{ background:green; }
.done{ background:dodgerblue; }

.money{
    margin-top:20px;
    font-size:24px;
    color:#00ff88;
}

.empty{
    text-align:center;
    color:#777;
}

</style>
</head>

<body>

<header>
    <h1>📦 Nova Posta Simulator</h1>
    <p>Симулятор логістики посилок</p>
</header>

<div class="panel">

<h2>📋 Посилки</h2>

<table>
<thead>
<tr>
    <th>ТТН</th>
    <th>Клієнт</th>
    <th>Статус</th>
    <th>Оплата</th>
    <th>Дія</th>
</tr>
</thead>

<tbody id="parcelBody">
<tr class="empty-row">
    <td colspan="5" class="empty">Немає посилок</td>
</tr>
</tbody>

</table>

</div>

<div class="panel">

<h2>➕ Додати посилку</h2>

<input id="ttn" placeholder="ТТН">
<input id="name" placeholder="Клієнт">
<input id="price" type="number" placeholder="Оплата">

<button onclick="addParcel()">Додати</button>

</div>

<script>

let stages = [
    {text:"Пакування", cls:"pack"},
    {text:"В дорозі", cls:"road"},
    {text:"Прибула до відділення", cls:"arrived"},
    {text:"Повернення товару", cls:"returning"},
    {text:"Повернулася", cls:"back"},
    {text:"Видано", cls:"done"}
];

function addParcel(){

    let ttn = document.getElementById("ttn").value;
    let name = document.getElementById("name").value;
    let price = document.getElementById("price").value;

    if(!ttn || !name || !price){
        alert("Заповни всі поля");
        return;
    }

    let body = document.getElementById("parcelBody");

    document.querySelector(".empty-row")?.remove();

    let row = document.createElement("tr");

    row.dataset.stage = "0";

    row.innerHTML = `
        <td>${ttn}</td>
        <td>${name}</td>
        <td>
            <span class="status pack">Пакування</span>
        </td>
        <td>${price} ₴</td>
        <td>
            <button onclick="nextStatus(this)">Оновити</button>
        </td>
    `;

    body.appendChild(row);
}

function nextStatus(btn){

    let row = btn.parentElement.parentElement;

    let stage = parseInt(row.dataset.stage);
    stage++;

    if(stage >= stages.length) stage = stages.length - 1;

    row.dataset.stage = stage;

    let statusCell = row.cells[2];

    statusCell.innerHTML = `
        <span class="status ${stages[stage].cls}">
            ${stages[stage].text}
        </span>
    `;
}

</script>

</body>
</html>
