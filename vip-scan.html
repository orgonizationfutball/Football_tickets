<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VIP Сканер</title>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body style="text-align:center;background:black;color:gold;">

<h1>⭐ VIP Вхід</h1>

<div id="reader" style="width:300px;margin:auto;"></div>

<h2 id="result">Скануй VIP QR</h2>

<script>

function onScanSuccess(text){

  let result = document.getElementById("result");

  // якщо це посилання на VIP сайт
  if(text.includes("vip.html?code=")){

    let code = text.split("code=")[1];

    if(code && code.startsWith("TICKET-")){
      document.body.style.background = "gold";
      result.innerText = "✅ VIP ДОЗВОЛЕНО";
    } else {
      document.body.style.background = "red";
      result.innerText = "❌ НЕ VIP";
    }

  } else {
    document.body.style.background = "red";
    result.innerText = "❌ НЕ VIP QR";
  }
}

let scanner = new Html5QrcodeScanner("reader",{fps:10});
scanner.render(onScanSuccess);

</script>

</body>
</html>
