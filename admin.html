<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Перевірка квитків</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}

h1 {
  margin-top: 20px;
}

#reader {
  width: 300px;
  margin: 20px auto;
}

.result {
  margin-top: 15px;
  font-size: 20px;
}

.ok { color: lime; }
.bad { color: red; }

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

.scan { background: green; color: white; }
.switch { background: orange; color: white; }
.reset { background: red; color: white; }

.list {
  margin-top: 20px;
  background: #111;
  padding: 10px;
  border-radius: 10px;
  width: 90%;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}

.item {
  border-bottom: 1px solid #333;
  padding: 5px;
}
</style>
</head>

<body>

<h1>📲 Перевірка квитків</h1>

<button class="scan" onclick="startScanner()">📷 Сканувати</button>
<button class="switch" onclick="switchCamera()">🔄 Камера</button>
<button class="reset" onclick="resetAll()">🗑 Скинути</button>

<div id="reader"></div>

<div id="result" class="result"></div>

<div class="list">
  <h3>📋 Хто зайшов:</h3>
  <div id="list"></div>
</div>

<script>
let usedTickets = JSON.parse(localStorage.getItem("usedTickets")) || [];
let peopleList = JSON.parse(localStorage.getItem("peopleList")) || [];

let html5QrCode;
let cameras = [];
let currentCamera = 0;

// 🔊 звук пік
function beep() {
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let oscillator = ctx.createOscillator();
  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(1000, ctx.currentTime);
  oscillator.connect(ctx.destination);
  oscillator.start();
  setTimeout(() => oscillator.stop(), 150);
}

// запуск
function startScanner() {
  html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {
    cameras = devices;

    if (devices.length) {
      // пробуємо одразу задню
      currentCamera = devices.length > 1 ? 1 : 0;
      startCamera(cameras[currentCamera].id);
    }
  });
}

function startCamera(id) {
  html5QrCode.start(
    id,
    { fps: 10, qrbox: 250 },
    qrCodeMessage => {
      beep();
      checkTicket(qrCodeMessage);
      html5QrCode.stop();
    }
  );
}

// переключення
function switchCamera() {
  if (!cameras.length) return;

  html5QrCode.stop().then(() => {
    currentCamera = (currentCamera + 1) % cameras.length;
    startCamera(cameras[currentCamera].id);
  });
}

// перевірка
function checkTicket(data) {
  let resultDiv = document.getElementById("result");

  try {
    let ticket = JSON.parse(data);

    if (usedTickets.includes(ticket.id)) {
      resultDiv.innerHTML = "❌ ВЖЕ ПРОХОДИВ<br>" + ticket.name;
      resultDiv.className = "result bad";
    } else {
      usedTickets.push(ticket.id);
      peopleList.push(ticket.name);

      localStorage.setItem("usedTickets", JSON.stringify(usedTickets));
      localStorage.setItem("peopleList", JSON.stringify(peopleList));

      resultDiv.innerHTML = "✅ ДОПУЩЕНО<br>" + ticket.name;
      resultDiv.className = "result ok";

      updateList();
    }

  } catch {
    resultDiv.innerHTML = "❌ Помилка QR";
    resultDiv.className = "result bad";
  }
}

// список
function updateList() {
  let listDiv = document.getElementById("list");
  listDiv.innerHTML = "";

  peopleList.forEach(name => {
    let div = document.createElement("div");
    div.className = "item";
    div.innerText = "👤 " + name;
    listDiv.appendChild(div);
  });
}

// скинути
function resetAll() {
  localStorage.removeItem("usedTickets");
  localStorage.removeItem("peopleList");
  usedTickets = [];
  peopleList = [];
  updateList();
  document.getElementById("result").innerHTML = "Скинуто";
}

// при відкритті
updateList();
</script>

</body>
</html>
