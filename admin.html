<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Охорона | Сканер квитків PRO</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}

h1 {
  margin-top: 20px;
}

#reader {
  width: 300px;
  margin: 20px auto;
}

.result {
  font-size: 22px;
  margin-top: 20px;
  padding: 10px;
}

.ok { color: lightgreen; }
.bad { color: red; }

.list {
  margin-top: 20px;
  max-width: 300px;
  margin-left: auto;
  margin-right: auto;
  text-align: left;
}

button {
  margin-top: 10px;
  padding: 8px;
  border-radius: 8px;
  border: none;
  background: red;
  color: white;
}
</style>
</head>

<body>

<h1>🛂 Сканер квитків PRO</h1>

<div id="reader"></div>

<div class="result" id="result">Скануй квиток...</div>

<button onclick="clearList()">Очистити список 🧹</button>

<div class="list">
  <h3>📋 Зайшли:</h3>
  <ul id="people"></ul>
</div>

<script>

// звук
function beep(ok = true) {
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.value = ok ? 800 : 200;
  osc.connect(ctx.destination);
  osc.start();
  setTimeout(() => osc.stop(), 150);
}

// база
let usedTickets = JSON.parse(localStorage.getItem("usedTickets")) || [];
let lastScan = "";

// показ списку
function renderList() {
  let ul = document.getElementById("people");
  ul.innerHTML = "";
  usedTickets.forEach(t => {
    let li = document.createElement("li");
    li.textContent = t;
    ul.appendChild(li);
  });
}

renderList();

// очистка
function clearList() {
  usedTickets = [];
  localStorage.removeItem("usedTickets");
  renderList();
  document.getElementById("result").innerHTML = "🧹 Список очищено";
}

// збереження
function saveUsed() {
  localStorage.setItem("usedTickets", JSON.stringify(usedTickets));
}

// скан
function onScanSuccess(decodedText) {

  if (decodedText === lastScan) return;

  lastScan = decodedText;
  setTimeout(() => { lastScan = ""; }, 3000);

  if (usedTickets.includes(decodedText)) {
    beep(false);
    document.getElementById("result").innerHTML =
      "<span class='bad'>❌ Квиток вже використаний!</span>";
    return;
  }

  usedTickets.push(decodedText);
  saveUsed();
  renderList();

  beep(true);
  document.getElementById("result").innerHTML =
    "<span class='ok'>✅ Допуск дозволено</span><br>" + decodedText;
}

// запуск
let scanner = new Html5QrcodeScanner("reader", {
  fps: 10,
  qrbox: 250
});

scanner.render(onScanSuccess);

</script>

</body>
</html>
