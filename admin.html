<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Адмінка</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}

#reader {
  width: 300px;
  margin: auto;
}

.result {
  font-size: 30px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>🛂 Перевірка квитків</h1>

<div id="reader"></div>

<div class="result" id="result">Скануй QR...</div>

<script>

function check(code) {
  if (code.startsWith("TICKET-")) {
    document.getElementById("result").innerText = "✅ OK";
    document.getElementById("result").style.color = "lightgreen";
  } else {
    document.getElementById("result").innerText = "❌ Помилка";
    document.getElementById("result").style.color = "red";
  }
}

const scanner = new Html5Qrcode("reader");

scanner.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  (decodedText) => {
    check(decodedText);
  }
);

</script>

</body>
</html>
