<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Охорона | Сканер квитків</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}

h1 {
  margin-top: 20px;
}

#reader {
  width: 300px;
  margin: 20px auto;
}

.result {
  font-size: 20px;
  margin-top: 20px;
  padding: 10px;
}

.ok {
  color: lightgreen;
}

.bad {
  color: red;
}
</style>
</head>

<body>

<h1>🛂 Сканер квитків</h1>

<div id="reader"></div>

<div class="result" id="result">Скануй квиток...</div>

<script>
let usedTickets = JSON.parse(localStorage.getItem("usedTickets")) || [];

function saveUsed() {
  localStorage.setItem("usedTickets", JSON.stringify(usedTickets));
}

function onScanSuccess(decodedText) {

  if (usedTickets.includes(decodedText)) {
    document.getElementById("result").innerHTML =
      "<span class='bad'>❌ Квиток вже використаний!</span>";
    return;
  }

  usedTickets.push(decodedText);
  saveUsed();

  document.getElementById("result").innerHTML =
    "<span class='ok'>✅ Допуск дозволено</span><br>" + decodedText;
}

let scanner = new Html5QrcodeScanner("reader", {
  fps: 10,
  qrbox: 250
});

scanner.render(onScanSuccess);
</script>

</body>
</html>
