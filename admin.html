<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}

button {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}

.scan { background: green; color: white; }
.switch { background: orange; color: white; }
.reset { background: red; color: white; }
.security { background: crimson; color: white; }

#reader {
  width: 300px;
  margin: auto;
}

.ok { color: lime; font-size: 20px; }
.bad { color: red; font-size: 20px; }

.list {
  margin-top: 20px;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="login">
  <h2>🔐 Вхід</h2>
  <input type="password" id="pass" placeholder="Пароль">
  <br>
  <button onclick="login()">Увійти</button>
</div>

<!-- 🔥 ADMIN -->
<div id="admin" style="display:none">

<h1>🎮 MATCH CONTROL</h1>

<p>🎟 <span id="count">0</span> / 20</p>

<button class="scan" onclick="startScanner()">📷 Сканувати</button>
<button class="switch" onclick="switchCamera()">🔄 Камера</button>
<button class="security" onclick="toggleSecurity()">🚨 СТОП ВХІД</button>
<button class="reset" onclick="resetAll()">🗑 Скинути</button>

<div id="reader"></div>
<div id="result"></div>

<div class="list">
<h3>📋 Хто зайшов:</h3>
<div id="list"></div>
</div>

</div>

<script>

// 🔐 пароль
const PASSWORD = "2016";

// 🎟 ліміт
const MAX = 20;

// 🚨 режим безпеки
let securityMode = false;

// дані
let used = JSON.parse(localStorage.getItem("used")) || [];
let people = JSON.parse(localStorage.getItem("people")) || [];

let scanner;
let cameras = [];
let camIndex = 0;

// LOGIN
function login() {
  let p = document.getElementById("pass").value;

  if (p === PASSWORD) {
    document.getElementById("login").style.display = "none";
    document.getElementById("admin").style.display = "block";
    update();
  } else {
    alert("❌ Невірний пароль");
  }
}

// 🔊 звук
function beep() {
  let ctx = new (window.AudioContext || window.webkitAudioContext)();
  let o = ctx.createOscillator();
  o.frequency.value = 1000;
  o.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),150);
}

// 🚨 режим
function toggleSecurity() {
  securityMode = !securityMode;

  alert(
    securityMode
    ? "⛔ ВХІД ЗАКРИТО"
    : "✅ ВХІД ВІДКРИТО"
  );
}

// СТАРТ СКАНЕРА
function startScanner() {
  scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devs=>{
    cameras = devs;
    camIndex = devs.length > 1 ? 1 : 0;
    startCam(cameras[camIndex].id);
  });
}

function startCam(id) {
  scanner.start(
    id,
    { fps:10, qrbox:250 },
    msg=>{
      beep();
      check(msg);
      scanner.stop();
    }
  );
}

// 🔄 камера
function switchCamera() {
  if (!cameras.length) return;

  scanner.stop().then(()=>{
    camIndex = (camIndex+1)%cameras.length;
    startCam(cameras[camIndex].id);
  });
}

// ✅ перевірка
function check(data) {
  let r = document.getElementById("result");

  if (securityMode) {
    r.innerHTML = "⛔ ВХІД ЗАКРИТО";
    r.className = "bad";
    return;
  }

  try {
    let t = JSON.parse(data);

    if (used.includes(t.id)) {
      r.innerHTML = "❌ ВЖЕ БУВ<br>"+t.name;
      r.className = "bad";
      return;
    }

    if (people.length >= MAX) {
      r.innerHTML = "⛔ НЕМА МІСЦЬ";
      r.className = "bad";
      return;
    }

    used.push(t.id);
    people.push(t.name);

    localStorage.setItem("used", JSON.stringify(used));
    localStorage.setItem("people", JSON.stringify(people));

    r.innerHTML = "✅ ДОПУЩЕНО<br>"+t.name;
    r.className = "ok";

    update();

  } catch {
    r.innerHTML = "❌ ПОМИЛКА QR";
    r.className = "bad";
  }
}

// 📋 список
function update() {
  document.getElementById("count").innerText = people.length;

  let list = document.getElementById("list");
  list.innerHTML = "";

  people.forEach(p=>{
    let d = document.createElement("div");
    d.innerText = "👤 "+p;
    list.appendChild(d);
  });
}

// 🗑 reset
function resetAll() {
  localStorage.clear();
  used=[];
  people=[];
  update();
  document.getElementById("result").innerHTML = "Скинуто";
}

</script>

</body>
</html>
