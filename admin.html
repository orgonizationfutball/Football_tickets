<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Перевірка квитків</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: Arial;
}

#reader {
  width: 300px;
  margin: auto;
}

.result {
  margin-top: 20px;
  font-size: 20px;
}
.ok { color: lime; }
.bad { color: red; }

button {
  padding: 10px;
  margin: 10px;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<h1>📲 Перевірка квитків</h1>

<button onclick="startScanner()">📷 Сканувати QR</button>

<div id="reader"></div>

<div id="result" class="result"></div>

<script>
let usedTickets = JSON.parse(localStorage.getItem("usedTickets")) || [];

function startScanner() {
  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {
    if (devices && devices.length) {
      html5QrCode.start(
        devices[0].id,
        { fps: 10, qrbox: 250 },
        qrCodeMessage => {
          checkTicket(qrCodeMessage);
          html5QrCode.stop();
        }
      );
    }
  });
}

function checkTicket(data) {
  let resultDiv = document.getElementById("result");

  try {
    let ticket = JSON.parse(data);

    if (usedTickets.includes(ticket.id)) {
      resultDiv.innerHTML = "❌ Квиток вже використаний<br>" + ticket.name;
      resultDiv.className = "result bad";
    } else {
      usedTickets.push(ticket.id);
      localStorage.setItem("usedTickets", JSON.stringify(usedTickets));

      resultDiv.innerHTML = "✅ Прохід дозволено<br>" + ticket.name;
      resultDiv.className = "result ok";
    }

  } catch {
    resultDiv.innerHTML = "❌ Помилка QR";
    resultDiv.className = "result bad";
  }
}
</script>

</body>
</html>
