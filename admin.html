<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body style="text-align:center">

<h2>🛂 Сканер</h2>

<div id="reader" style="width:300px;margin:auto;"></div>

<h3 id="result"></h3>

<script>

function onScanSuccess(decodedText){

  let result = document.getElementById("result");

  try{
    let t = JSON.parse(decodedText);

    if(t.type==="VIP"){
      document.body.style.background="gold";
      result.innerText="⭐ VIP: "+t.name;
    } else {
      document.body.style.background="green";
      result.innerText="🟢 OK: "+t.name;
    }

  }catch{

    if(decodedText.includes("vip.html")){
      result.innerText="⭐ VIP LINK";
      document.body.style.background="gold";
    }else{
      result.innerText="❌ Помилка";
      document.body.style.background="red";
    }

  }
}

let scanner = new Html5QrcodeScanner("reader",{fps:10});
scanner.render(onScanSuccess);

</script>

</body>
</html>
