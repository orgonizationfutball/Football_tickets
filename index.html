<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Квитки на футбол</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
  background: linear-gradient(#0b6623, #003300);
  font-family: Arial;
  text-align: center;
  color: white;
}

.ticket {
  background: white;
  color: black;
  width: 320px;
  margin: 30px auto;
  padding: 20px;
  border-radius: 15px;
}

input {
  padding: 10px;
  width: 80%;
  margin-top: 10px;
}

button {
  background: green;
  color: white;
  padding: 10px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
}

.qr {
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>⚽ Квитки на футбол</h1>

<div class="ticket">
  <h2>Товариський матч</h2>
  <p>📅 30 травня</p>
  <p>⏰ 19:00</p>

  <input type="text" id="name" placeholder="Введи ім'я">

  <br>
  <button onclick="buyTicket()">Купити квиток 🎟️</button>
</div>

<h2>📋 Мої квитки</h2>
<div id="tickets"></div>

<br><br>

<div class="ticket">
  <h3>📞 Підтримка</h3>
  <p>Проблема з квитком? Дзвони:</p>
  <a href="tel:+380982556470">+380 98 255 64 70</a>
</div>

<script>

function getTickets() {
  return JSON.parse(localStorage.getItem("tickets") || "[]");
}

function saveTickets(tickets) {
  localStorage.setItem("tickets", JSON.stringify(tickets));
}

function buyTicket() {
  const name = document.getElementById("name").value.trim();

  if (!name) {
    alert("Введи ім'я!");
    return;
  }

  const tickets = getTickets();

  const id = "TICKET-" + Date.now();

  tickets.push({
    id: id,
    name: name,
    used: false
  });

  saveTickets(tickets);
  document.getElementById("name").value = "";

  renderTickets();
}

function renderTickets() {
  const tickets = getTickets();
  const container = document.getElementById("tickets");
  container.innerHTML = "";

  tickets.forEach(t => {
    const div = document.createElement("div");
    div.className = "ticket";

    div.innerHTML = `
      <h3>${t.name}</h3>
      <p>ID: ${t.id}</p>
      <div id="qr-${t.id}" class="qr"></div>
    `;

    container.appendChild(div);

    new QRCode(document.getElementById(`qr-${t.id}`), t.id);
  });
}

renderTickets();

</script>

</body>
</html>
