<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Квитки</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
  background: linear-gradient(#0b6623, #003300);
  font-family: Arial;
  text-align: center;
  color: white;
}

.ticket {
  background: white;
  color: black;
  width: 320px;
  margin: 30px auto;
  padding: 20px;
  border-radius: 15px;
}

input {
  padding: 8px;
  margin: 10px;
  width: 80%;
}

button {
  background: green;
  color: white;
  padding: 10px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
}

.list {
  background: white;
  color: black;
  width: 320px;
  margin: 20px auto;
  padding: 10px;
  border-radius: 10px;
  text-align: left;
}
</style>
</head>

<body>

<h1>⚽ Квитки на футбол</h1>

<div class="ticket">
  <h2>Товариський матч</h2>
  <p>📅 30 травня</p>
  <p>⏰ 19:00</p>

  <!-- ОЦЕ ГОЛОВНЕ -->
  <input id="name" placeholder="Введи ім'я">

  <div id="qrcode"></div>

  <button onclick="generate()">Отримати квиток 🎟️</button>
</div>

<div class="list">
  <h3>📋 Глядачі:</h3>
  <ul id="viewerList"></ul>
</div>

<script>
let viewers = JSON.parse(localStorage.getItem("viewers")) || [];

function save() {
  localStorage.setItem("viewers", JSON.stringify(viewers));
}

function render() {
  const list = document.getElementById("viewerList");
  list.innerHTML = "";
  viewers.forEach(v => {
    const li = document.createElement("li");
    li.textContent = v.name + " — " + v.ticket;
    list.appendChild(li);
  });
}

function generate() {
  const name = document.getElementById("name").value;

  if (!name) {
    alert("Введи ім'я!");
    return;
  }

  const ticket = "TICKET-" + Math.floor(Math.random()*100000);

  viewers.push({ name, ticket });
  save();
  render();

  document.getElementById("qrcode").innerHTML = "";
  new QRCode(document.getElementById("qrcode"), ticket);
}

render();
</script>

</body>
</html>
