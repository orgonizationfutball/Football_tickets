<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Football Tickets PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body { background:#0b6623; color:white; text-align:center; font-family:Arial; }

.ticket {
  background:white; color:black; width:320px;
  margin:20px auto; padding:15px; border-radius:15px;
}

button { padding:8px; margin:5px; background:green; color:white; border:none; border-radius:6px; }
input, select { margin:5px; padding:5px; }
</style>
</head>

<body>

<h1>⚽ Football Tickets</h1>

<!-- ТАБЛО -->
<h2 id="score">0 : 0</h2>
<button onclick="goal(1)">Гол 1</button>
<button onclick="goal(2)">Гол 2</button>

<!-- ТАЙМЕР -->
<h2 id="timer">00:00</h2>
<button onclick="start()">▶️</button>
<button onclick="stop()">⏸️</button>

<div class="ticket">

<h3>🎟️ Купити квиток</h3>

<label>👤 Ім’я</label><br>
<input id="name"><br>

<label>🎟️ Тип</label><br>
<select id="type">
<option>Звичайний</option>
<option>VIP</option>
<option>Гравець</option>
</select><br>

<label>📅 Дата</label><br>
<input id="date" type="date"><br>

<label>⏰ Час</label><br>
<input id="time" type="time"><br>

<label>📍 Сектор</label><br>
<input id="sector"><br>

<label>Ряд</label><br>
<input id="row"><br>

<label>Місце</label><br>
<input id="seat"><br>

<button onclick="buy()">Купити</button>

<div id="qr"></div>

</div>

<h2>📋 Глядачі</h2>
<div id="list"></div>

<h3>📊 Зайшло: <span id="entered">0</span></h3>

<script>

// табло
let s1=0,s2=0;
function goal(t){ if(t==1)s1++; else s2++; score.innerText=s1+" : "+s2; }

// таймер
let time=0,int;
function start(){ int=setInterval(()=>{ time++; timer.innerText=
String(Math.floor(time/60)).padStart(2,'0')+":"+String(time%60).padStart(2,'0'); },1000);}
function stop(){ clearInterval(int); }

// квитки
let tickets = JSON.parse(localStorage.getItem("tickets")||"[]");

function save(){ localStorage.setItem("tickets",JSON.stringify(tickets)); }

function buy(){
  let name=name.value, date=date.value, timeV=time.value;

  if(!name||!date||!timeV){ alert("Заповни все"); return; }

  let t={
    id:"T"+Date.now(),
    name:name,
    type:type.value,
    sector:sector.value,
    row:row.value,
    seat:seat.value,
    date:date,
    time:timeV,
    used:false
  };

  tickets.push(t);
  save();
  render();

  qr.innerHTML="";
  new QRCode(qr,t.id);
}

function render(){
  list.innerHTML="";
  let count=0;

  tickets.forEach(t=>{
    if(t.used) count++;

    let div=document.createElement("div");
    div.className="ticket";

    div.innerHTML=`
    👤 ${t.name}<br>
    🎟️ ${t.type}<br>
    📅 ${t.date}<br>
    ⏰ ${t.time}<br>
    📍 ${t.sector}-${t.row}-${t.seat}<br>
    ${t.used?"🟢 ЗАЙШОВ":"🔴 НЕ ЗАЙШОВ"}
    `;

    list.appendChild(div);
  });

  entered.innerText=count;
}

render();

</script>

</body>
</html>
