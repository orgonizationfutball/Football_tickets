<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Квитки на футбол</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
  background: linear-gradient(#0b6623, #003300);
  font-family: Arial;
  text-align: center;
  color: white;
}

.ticket {
  background: white;
  color: black;
  width: 320px;
  margin: 20px auto;
  padding: 15px;
  border-radius: 15px;
}

input, select {
  padding: 10px;
  width: 80%;
  margin-top: 10px;
}

button {
  background: green;
  color: white;
  padding: 10px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>⚽ Квитки на футбол</h1>

<div class="ticket">

<p>📅 1 травня</p>
<p>⏰ 19:00</p>

<p>🎟 Залишилось: <span id="left"></span> / 20</p>

<input id="name" placeholder="Введи ім'я">

<select id="type">
  <option value="NORMAL">🟢 Звичайний</option>
  <option value="VIP">🟡 VIP</option>
</select>

<br>

<p>💳 Ціна: 50 грн</p>

<a href="https://send.monobank.ua/jar/762ovKnizs" target="_blank">
  <button>💳 Оплатити</button>
</a>

<button onclick="confirmPayment()">✅ Я оплатив</button>

<div id="qrcode"></div>

</div>

<h2>📋 Мої квитки</h2>
<div id="list"></div>

<script>

const MAX = 20;

// --- отримати ---
function getTickets(){
  return JSON.parse(localStorage.getItem("tickets") || "[]");
}

// --- зберегти ---
function save(t){
  localStorage.setItem("tickets", JSON.stringify(t));
}

// --- залишок ---
function updateLeft(){
  let t = getTickets();
  let left = MAX - t.length;
  if(left < 0) left = 0;
  document.getElementById("left").innerText = left;
}

// --- оплата ---
function confirmPayment(){

  let ok = confirm("Ти точно оплатив 50 грн?");
  if(!ok) return;

  let name = document.getElementById("name").value.trim();
  let type = document.getElementById("type").value;

  if(!name){
    alert("Введи ім'я!");
    return;
  }

  let tickets = getTickets();

  if(tickets.length >= MAX){
    alert("⛔ Місць нема!");
    return;
  }

  let ticket = {
    id: "TICKET-" + Date.now(),
    name: name,
    type: type
  };

  tickets.push(ticket);
  save(tickets);

  showQR(ticket);
  render();
  updateLeft();
}

// --- QR ---
function showQR(t){
  document.getElementById("qrcode").innerHTML = "";

  new QRCode(document.getElementById("qrcode"),
    JSON.stringify(t)
  );
}

// --- список ---
function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  let tickets = getTickets();

  tickets.forEach(t => {

    let color = t.type === "VIP" ? "gold" : "white";

    let div = document.createElement("div");
    div.className = "ticket";
    div.style.background = color;

    div.innerHTML = `
      👤 ${t.name}<br>
      🎟 ${t.type}<br>
      <button onclick='showQR(${JSON.stringify(t)})'>QR</button>
    `;

    list.appendChild(div);
  });
}

// --- старт ---
render();
updateLeft();

</script>

</body>
</html>
