<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Football Tickets</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
  background: linear-gradient(#0b6623, #003300);
  font-family: Arial;
  text-align: center;
  color: white;
}

.ticket {
  background: white;
  color: black;
  width: 320px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 15px;
}

input {
  padding: 8px;
  margin: 5px;
  border-radius: 5px;
  border: none;
}

button {
  background: green;
  color: white;
  padding: 10px;
  border: none;
  border-radius: 8px;
  margin-top: 5px;
}

.list {
  margin-top: 20px;
}

.support {
  margin-top: 30px;
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>⚽ Квитки на футбол</h1>

<div class="ticket">
  <h2>Товариський матч</h2>
  <p>📅 30 травня</p>
  <p>⏰ 19:00</p>

  <input id="name" placeholder="Твоє ім'я">
  <br>

  <button onclick="buy()">Купити квиток 🎟️</button>

  <div id="qrcode"></div>

  <p>⚠️ Збережи скрін квитка</p>
</div>

<div class="list">
  <h2>📋 Мої квитки</h2>
  <div id="tickets"></div>
</div>

<div class="support">
  <h3>🆘 Підтримка</h3>
  <p>Проблема з квитком? Зв’яжись:</p>

  <p>📞 +380 98 255 64 70</p>

  <a href="tel:+380982556470">
    <button>📞 Подзвонити</button>
  </a>

  <a href="https://t.me/your_username" target="_blank">
    <button>Telegram 💬</button>
  </a>

  <a href="viber://chat?number=+380982556470">
    <button>Viber 📱</button>
  </a>
</div>

<script>

let tickets = JSON.parse(localStorage.getItem("tickets")) || [];

function save() {
  localStorage.setItem("tickets", JSON.stringify(tickets));
}

function buy() {
  let name = document.getElementById("name").value.trim();

  if (!name) {
    alert("Введи ім'я!");
    return;
  }

  // ❌ перевірка дубля
  let exists = tickets.find(t => t.name.toLowerCase() === name.toLowerCase());

  if (exists) {
    alert("У тебе вже є квиток!");
    showQR(exists.code);
    return;
  }

  let code = "TICKET-" + name + "-" + Math.floor(Math.random()*10000);

  tickets.push({ name: name, code: code });
  save();

  showQR(code);
  render();
}

function showQR(data) {
  document.getElementById("qrcode").innerHTML = "";
  new QRCode(document.getElementById("qrcode"), data);
}

function render() {
  let div = document.getElementById("tickets");
  div.innerHTML = "";

  tickets.forEach(t => {
    let block = document.createElement("div");
    block.style.background = "white";
    block.style.color = "black";
    block.style.margin = "10px";
    block.style.padding = "10px";
    block.style.borderRadius = "10px";

    block.innerHTML = `
      👤 ${t.name}<br>
      🎫 ${t.code}<br>
      <button onclick="showQR('${t.code}')">Показати QR</button>
    `;

    div.appendChild(block);
  });
}

render();

</script>

</body>
</html>
