<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Football Tickets PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
  background: #0b6623;
  color: white;
  text-align: center;
  font-family: Arial;
}

.ticket {
  background: white;
  color: black;
  width: 340px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 15px;
}

label {
  font-size: 14px;
  display: block;
  margin-top: 8px;
}

input, select {
  width: 90%;
  padding: 8px;
  margin-top: 3px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  padding: 10px;
  margin-top: 10px;
  background: green;
  color: white;
  border: none;
  border-radius: 8px;
  width: 90%;
}

.qr {
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>⚽ Football Tickets</h1>

<div class="ticket">

<h3>🎟️ Купити квиток</h3>

<label>👤 Ім’я</label>
<input id="name" placeholder="Наприклад: Себа">

<label>🎟️ Тип квитка</label>
<select id="type">
<option>Звичайний</option>
<option>VIP</option>
<option>Гравець</option>
</select>

<label>📅 Дата</label>
<input id="date" type="date">

<label>⏰ Час</label>
<input id="time" type="time">

<label>📍 Сектор</label>
<input id="sector" placeholder="A">

<label>Ряд</label>
<input id="row" placeholder="1">

<label>Місце</label>
<input id="seat" placeholder="5">

<button onclick="buy()">Купити квиток 🎟️</button>

<div id="qr" class="qr"></div>

</div>

<h2>📋 Мої квитки</h2>
<div id="list"></div>

<script>

function getTickets(){
  return JSON.parse(localStorage.getItem("tickets")||"[]");
}

function saveTickets(t){
  localStorage.setItem("tickets", JSON.stringify(t));
}

function buy(){
  let name = document.getElementById("name").value.trim();
  let type = document.getElementById("type").value;
  let date = document.getElementById("date").value;
  let time = document.getElementById("time").value;
  let sector = document.getElementById("sector").value;
  let row = document.getElementById("row").value;
  let seat = document.getElementById("seat").value;

  if(!name || !date || !time){
    alert("Заповни ім’я, дату і час!");
    return;
  }

  let tickets = getTickets();

  let ticket = {
    id: "TICKET-" + Date.now(),
    name, type, date, time, sector, row, seat,
    used: false
  };

  tickets.push(ticket);
  saveTickets(tickets);

  // показ QR
  document.getElementById("qr").innerHTML = "";
  new QRCode(document.getElementById("qr"), ticket.id);

  render();
}

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  let tickets = getTickets();

  tickets.forEach(t => {
    let div = document.createElement("div");
    div.className = "ticket";

    div.innerHTML = `
      👤 ${t.name}<br>
      🎟️ ${t.type}<br>
      📅 ${t.date}<br>
      ⏰ ${t.time}<br>
      📍 ${t.sector}-${t.row}-${t.seat}<br>
      ${t.used ? "🟢 ЗАЙШОВ" : "🔴 НЕ ЗАЙШОВ"}<br>
      <button onclick="showQR('${t.id}')">Показати QR</button>
    `;

    list.appendChild(div);
  });
}

function showQR(id){
  document.getElementById("qr").innerHTML = "";
  new QRCode(document.getElementById("qr"), id);
}

render();

</script>

</body>
</html>
