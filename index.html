<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Football Tickets</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
  background: linear-gradient(#0b6623, #003300);
  font-family: Arial;
  text-align: center;
  color: white;
}

.ticket {
  background: white;
  color: black;
  width: 320px;
  margin: 50px auto;
  padding: 20px;
  border-radius: 15px;
}

button {
  background: green;
  color: white;
  padding: 10px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>⚽ Квитки на футбол</h1>

<div class="ticket" id="ticket">
  <h2>Товариський матч</h2>
  <p>📅 30 травня</p>
  <p>⏰ 19:00</p>
  <div id="qrcode"></div>
  <button onclick="generate()">Згенерувати квиток 🎟️</button>
  <button onclick="download()">Скачати PDF 📄</button>
</div>

<script>
let qrData = "";

function generate() {
  qrData = "TICKET-" + Math.floor(Math.random()*100000);
  document.getElementById("qrcode").innerHTML = "";
  new QRCode(document.getElementById("qrcode"), qrData);
}

function download() {
  const element = document.getElementById("ticket");
  const win = window.open('', '', 'height=600,width=400');
  win.document.write(element.innerHTML);
  win.document.close();
  win.print();
}
</script>

</body>
</html>
